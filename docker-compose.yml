services:
    pelagica:
        # Built by .github/workflows/ghcr-build.yml. To build from source, use docker-compose.local.yml
        image: ghcr.io/austincnunn/pelagica:latest
        container_name: pelagica
        ports:
            - '8080:80'
        volumes:
            - ./config:/config
        # environment:
        #     - SERVER_ADDRESS=http://your-jellyfin-or-emby-server:8096 # prefills the login screen
        restart: unless-stopped
        healthcheck:
            test:
                ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
